# Heap capped at 4G so the Gradle daemon fits CI runners (GitHub-hosted Linux
# runners have ~7G RAM; an 8G heap over-commits and the runner is reclaimed
# mid-build with SIGTERM/143). 4G is ample for R8 + resource shrinking here.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Disable Gradle file-system watching on CI (source of the harmless but noisy
# "Already watching path" exception; not useful for one-shot CI builds).
org.gradle.vfs.watch=false
# R8 optimized resource shrinking (Play Console recommendation; default from
# AGP 9). Resources referenced only by name from Dart must stay listed in
# app/src/main/res/raw/keep.xml, or they are stripped from release builds.
android.r8.optimizedResourceShrinking=true
