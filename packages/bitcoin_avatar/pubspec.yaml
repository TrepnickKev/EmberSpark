name: bitcoin_avatar
description: Deterministic Bitcoin/Lightning themed emblem avatars, generated from a seed string with a pure-Dart CustomPainter.
version: 0.1.0
publish_to: 'none'

environment:
  sdk: '^3.11.0'
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  assets:
    - assets/background/
    - assets/animal/
    - assets/detail/
    - assets/badge/
