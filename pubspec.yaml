name: ember_spark
description: EmberSpark — Lightning wallet
publish_to: 'none'
version: 1.0.15+1

environment:
  sdk: '^3.11.0'
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  http: ^1.2.0
  flutter_secure_storage: ^11.2.0
  mobile_scanner: ^7.2.0
  qr_flutter: ^4.1.0
  bech32: ^0.2.2
  app_links: ^7.0.0
  pointycastle: ^4.0.0
  local_auth: ^3.0.1
  package_info_plus: ^10.1.0
  url_launcher: ^6.3.2
  share_plus: ^13.1.0
  nfc_manager: ^4.0.2
  image_picker: ^1.1.2
  random_avatar: ^0.0.8
  animal_avatar:
    git:
      url: https://github.com/TrepnickKev/Animal-Avatar-Generator.git
      ref: v0.2.6
  flutter_file_dialog: ^3.0.2
  path_provider: ^2.1.5
  workmanager: ^0.10.10
  flutter_local_notifications: ^22.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  generate: true
  uses-material-design: true
  assets:
    - images/Logo_icon.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "images/Logo_icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "images/Logo_icon.png"
