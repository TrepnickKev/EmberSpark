name: Build Android APK

# Manual only — won't fire on push or PR. Click "Run workflow" in the
# Actions tab when you want a new build.
on:
  workflow_dispatch:

jobs:
  build:
    name: Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.9"
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Resolve dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze

      - name: Build release APKs (split per ABI)
        run: flutter build apk --release --split-per-abi

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: emberspark-release-apks
          path: build/app/outputs/flutter-apk/*-release.apk
          retention-days: 30
          if-no-files-found: error
