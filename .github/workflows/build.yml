name: Build & release Android APKs + AAB

# Manual only. Bump `version:` in pubspec.yaml (name+code), commit, then click
# "Run workflow" in the Actions tab. The version comes from pubspec so the tag
# matches the source, which F-Droid reads to build the same release.
# APKs are published as a GitHub Release in this repository (built-in
# GITHUB_TOKEN, see `permissions`) for sideloaders. The AAB is uploaded straight to the
# Google Play internal-testing track via a service account (secret
# PLAY_SERVICE_ACCOUNT_JSON), so it is not stored as an Actions artifact. If
# that secret is unset the upload step is skipped.
on:
  workflow_dispatch:

env:
  # Forces remaining v2 JS actions (e.g. subosito/flutter-action@v2) onto
  # Node 24 ahead of GitHub's 2026-06-02 forced cutover. Major-bumped actions
  # below already run on Node 24 natively.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  release:
    name: Build & publish
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Lets the built-in GITHUB_TOKEN create the GitHub Release (tag + APKs).
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # full history so auto-generated release notes can diff

      # pubspec `version: <name>+<code>`. Android refuses updates with a lower
      # code, so it must only ever grow (1.1.1 was 104). Split APKs add
      # 1000/2000/4000 per ABI on top, so keep the code below 1000.
      - name: Read version from pubspec
        run: |
          line=$(grep -m1 '^version:' pubspec.yaml | tr -d '[:space:]')
          if [[ ! "$line" =~ ^version:([0-9]+\.[0-9]+\.[0-9]+)\+([0-9]+)$ ]]; then
            echo "::error::pubspec.yaml version must look like 'version: 1.2.3+105', got '$line'"
            exit 1
          fi
          name=${BASH_REMATCH[1]}
          code=${BASH_REMATCH[2]}
          if (( code >= 1000 )); then
            echo "::error::Version code $code must stay below 1000 (split APK offsets)"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$name" >/dev/null; then
            echo "::error::Tag v$name already exists; bump the version in pubspec.yaml"
            exit 1
          fi
          echo "VERSION=$name" >> "$GITHUB_ENV"
          echo "Version $name, code $code"

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.9"
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Resolve dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze

      # Without key.properties Gradle falls back to the debug key, and Android
      # refuses to update an installed app signed with a different key. So a
      # missing secret must fail the build instead of being skipped.
      - name: Set up release signing
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        run: |
          if [[ -z "$KEYSTORE_B64" || -z "$STORE_PASSWORD" || -z "$KEY_PASSWORD" || -z "$KEY_ALIAS" ]]; then
            echo "::error::Release signing secrets are missing; a debug-signed APK can't update installed apps"
            exit 1
          fi
          echo "$KEYSTORE_B64" | base64 -d > android/app/release.keystore
          cat > android/key.properties <<EOF
          storeFile=release.keystore
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          # Sanity check: decoded keystore must not be empty.
          test -s android/app/release.keystore || (echo "::error::Decoded keystore is empty"; exit 1)

      - name: Build release APKs (split per ABI)
        run: |
          flutter build apk --release --split-per-abi

      - name: Rename APKs with version + brand
        run: |
          cd build/app/outputs/flutter-apk
          mv app-arm64-v8a-release.apk   "EmberSpark-v${{ env.VERSION }}-arm64-v8a.apk"
          mv app-armeabi-v7a-release.apk "EmberSpark-v${{ env.VERSION }}-armeabi-v7a.apk"
          mv app-x86_64-release.apk      "EmberSpark-v${{ env.VERSION }}-x86_64.apk"
          ls -lh

      - name: Build release App Bundle (.aab for Play Store)
        run: |
          flutter build appbundle --release

      - name: Rename AAB with version + brand
        run: |
          cd build/app/outputs/bundle/release
          mv app-release.aab "EmberSpark-v${{ env.VERSION }}.aab"
          ls -lh

      - name: Warn if the Play upload is skipped
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        if: ${{ env.PLAY_JSON == '' }}
        run: echo "::warning::PLAY_SERVICE_ACCOUNT_JSON is not set; the AAB is not uploaded to Google Play"

      - name: Upload AAB to Google Play (internal track)
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        if: ${{ env.PLAY_JSON != '' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ env.PLAY_JSON }}
          packageName: com.emberspark.wallet
          releaseFiles: build/app/outputs/bundle/release/EmberSpark-v${{ env.VERSION }}.aab
          tracks: internal
          status: completed

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ env.VERSION }}
          name: EmberSpark v${{ env.VERSION }}
          generate_release_notes: true
          files: |
            build/app/outputs/flutter-apk/EmberSpark-v${{ env.VERSION }}-arm64-v8a.apk
            build/app/outputs/flutter-apk/EmberSpark-v${{ env.VERSION }}-armeabi-v7a.apk
            build/app/outputs/flutter-apk/EmberSpark-v${{ env.VERSION }}-x86_64.apk
          fail_on_unmatched_files: true
