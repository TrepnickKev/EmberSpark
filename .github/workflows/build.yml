name: Build & release Android APKs

# Manual only. Click "Run workflow" in the Actions tab, fill in the version,
# and the workflow builds the APKs and publishes a GitHub Release on the
# PUBLIC TrepnickKev/EmberSpark repo (cross-repo write authenticated via a
# short-lived GitHub App installation token).
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (semver, e.g. 1.0.0 — no leading 'v')"
        required: true
        type: string

env:
  # Forces remaining v2 JS actions (e.g. subosito/flutter-action@v2) onto
  # Node 24 ahead of GitHub's 2026-06-02 forced cutover. Major-bumped actions
  # below already run on Node 24 natively.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  release:
    name: Build & publish v${{ inputs.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # full history so auto-generated release notes can diff

      - name: Validate version
        run: |
          if [[ ! "${{ inputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version '${{ inputs.version }}' — must be semver like 1.2.3"
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.9"
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Resolve dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze

      - name: Build release APKs (split per ABI)
        run: flutter build apk --release --split-per-abi

      - name: Rename APKs with version + brand
        run: |
          cd build/app/outputs/flutter-apk
          mv app-arm64-v8a-release.apk   "EmberSpark-v${{ inputs.version }}-arm64-v8a.apk"
          mv app-armeabi-v7a-release.apk "EmberSpark-v${{ inputs.version }}-armeabi-v7a.apk"
          mv app-x86_64-release.apk      "EmberSpark-v${{ inputs.version }}-x86_64.apk"
          ls -lh

      - name: Generate App installation token
        id: app_token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: TrepnickKev
          repositories: EmberSpark

      - name: Publish release in PUBLIC repo
        uses: softprops/action-gh-release@v3
        with:
          repository: TrepnickKev/EmberSpark
          token: ${{ steps.app_token.outputs.token }}
          tag_name: v${{ inputs.version }}
          name: EmberSpark v${{ inputs.version }}
          generate_release_notes: true
          files: |
            build/app/outputs/flutter-apk/EmberSpark-v${{ inputs.version }}-arm64-v8a.apk
            build/app/outputs/flutter-apk/EmberSpark-v${{ inputs.version }}-armeabi-v7a.apk
            build/app/outputs/flutter-apk/EmberSpark-v${{ inputs.version }}-x86_64.apk
          fail_on_unmatched_files: true
