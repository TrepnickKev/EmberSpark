name: Build & release Android APKs + AAB

# Manual only. Click "Run workflow" in the Actions tab, fill in the version.
# APKs are published as a GitHub Release on the PUBLIC TrepnickKev/EmberSpark
# repo (cross-repo write authenticated via a short-lived GitHub App
# installation token) for sideloaders. The AAB is uploaded straight to the
# Google Play internal-testing track via a service account (secret
# PLAY_SERVICE_ACCOUNT_JSON), so it is not stored as an Actions artifact. If
# that secret is unset the upload step is skipped.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (semver, e.g. 1.0.0 — no leading 'v')"
        required: true
        type: string

env:
  # Forces remaining v2 JS actions (e.g. subosito/flutter-action@v2) onto
  # Node 24 ahead of GitHub's 2026-06-02 forced cutover. Major-bumped actions
  # below already run on Node 24 natively.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  release:
    name: Build & publish v${{ inputs.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0  # full history so auto-generated release notes can diff

      - name: Validate version
        run: |
          if [[ ! "${{ inputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Invalid version '${{ inputs.version }}' — must be semver like 1.2.3"
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.9"
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Resolve dependencies
        run: flutter pub get

      - name: Static analysis
        run: flutter analyze

      - name: Set up release signing
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
        if: ${{ env.KEYSTORE_B64 != '' }}
        run: |
          echo "$KEYSTORE_B64" | base64 -d > android/app/release.keystore
          cat > android/key.properties <<EOF
          storeFile=release.keystore
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF
          # Sanity check: decoded keystore must not be empty.
          test -s android/app/release.keystore || (echo "::error::Decoded keystore is empty"; exit 1)

      - name: Build release APKs (split per ABI)
        run: |
          flutter build apk --release --split-per-abi \
            --build-name=${{ inputs.version }} \
            --build-number=${{ github.run_number }}

      - name: Rename APKs with version + brand
        run: |
          cd build/app/outputs/flutter-apk
          mv app-arm64-v8a-release.apk   "EmberSpark-v${{ inputs.version }}-arm64-v8a.apk"
          mv app-armeabi-v7a-release.apk "EmberSpark-v${{ inputs.version }}-armeabi-v7a.apk"
          mv app-x86_64-release.apk      "EmberSpark-v${{ inputs.version }}-x86_64.apk"
          ls -lh

      - name: Build release App Bundle (.aab for Play Store)
        run: |
          flutter build appbundle --release \
            --build-name=${{ inputs.version }} \
            --build-number=${{ github.run_number }}

      - name: Rename AAB with version + brand
        run: |
          cd build/app/outputs/bundle/release
          mv app-release.aab "EmberSpark-v${{ inputs.version }}.aab"
          ls -lh

      - name: Upload AAB to Google Play (internal track)
        env:
          PLAY_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        if: ${{ env.PLAY_JSON != '' }}
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ env.PLAY_JSON }}
          packageName: com.emberspark.wallet
          releaseFiles: build/app/outputs/bundle/release/EmberSpark-v${{ inputs.version }}.aab
          tracks: internal
          status: completed

      - name: Generate App installation token
        id: app_token
        uses: actions/create-github-app-token@v3
        with:
          app-id: ${{ secrets.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: TrepnickKev
          repositories: EmberSpark

      - name: Publish release in PUBLIC repo
        uses: softprops/action-gh-release@v3
        with:
          repository: TrepnickKev/EmberSpark
          token: ${{ steps.app_token.outputs.token }}
          tag_name: v${{ inputs.version }}
          name: EmberSpark v${{ inputs.version }}
          generate_release_notes: true
          files: |
            build/app/outputs/flutter-apk/EmberSpark-v${{ inputs.version }}-arm64-v8a.apk
            build/app/outputs/flutter-apk/EmberSpark-v${{ inputs.version }}-armeabi-v7a.apk
            build/app/outputs/flutter-apk/EmberSpark-v${{ inputs.version }}-x86_64.apk
          fail_on_unmatched_files: true
